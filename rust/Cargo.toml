[package]
name = "shaia-display"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
ab_glyph = "0.2"
chrono = "0.4"
drm = "0.14"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
